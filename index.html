<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAHUATL IA</title>
</head>

<body>
  <h1>NAHUATL IA</h1>
  <h3>Preservando la lengua Náhuatl</h3>

  <p>Ma yolihui to tlajtol.</p>

  <button onclick="iniciarGrabacion()">
   <h2>Ficha del hablante</h2>

<label>Nombre o seudónimo:</label><br>
<input type="text" id="hablante" placeholder="¿Cómo te identificamos?"><br><br>

<label>Comunidad de origen:</label><br>
<input type="text" id="comunidad" placeholder="Comunidad y municipio"><br><br>

<label>Variante del náhuatl:</label><br>
<input type="text" id="variante" value="Náhuatl de la Huasteca Veracruzana"><br><br>

<label>Palabra o frase que vas a pronunciar:</label><br>
<input type="text" id="frase" placeholder="Escribe la palabra o frase"><br><br>

<label>
  <input type="checkbox" id="consentimiento">
  Autorizo que NAHUATL IA almacene y revise esta grabación para su proyecto de preservación lingüística.
</label>
<br><br>
    🎙️ Iniciar grabación
  </button>

  <button onclick="detenerGrabacion()">
    ⏹️ Detener grabación
  </button>

  <p id="estado">Esperando...</p>

  <audio id="reproductor" controls></audio>

  <p>
    <a id="descargar" style="display:none">
      Descargar audio
    </a>
  </p>

  <p>
    Creado por Alejandro Hernández Hernández.
  </p>

  <script>
    let grabadora;
    let fragmentos = [];
    let archivoAudio;

    async function iniciarGrabacion() {
      const hablante = document.getElementById("hablante").value.trim();
const comunidad = document.getElementById("comunidad").value.trim();
const variante = document.getElementById("variante").value.trim();
const frase = document.getElementById("frase").value.trim();
const consentimiento = document.getElementById("consentimiento").checked;

if (!hablante || !comunidad || !variante || !frase) {
  alert("Completa todos los datos de la ficha.");
  return;
}

if (!consentimiento) {
  alert("Necesitamos tu autorización antes de grabar.");
  return;
}
      try {
        const flujo =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        fragmentos = [];

        grabadora = new MediaRecorder(flujo);

        grabadora.ondataavailable = function(event) {
          if (event.data.size > 0) {
            fragmentos.push(event.data);
          }
        };

        grabadora.onstop = function() {
          archivoAudio = new Blob(fragmentos, {
            type: grabadora.mimeType
          });

          const direccion =
            URL.createObjectURL(archivoAudio);

          document.getElementById("reproductor").src =
            direccion;

          const enlace =
            document.getElementById("descargar");

          enlace.href = direccion;
         const nombreArchivo =
  "Nahuatl_" +
  hablante.replace(/\s+/g, "_") + "_" +
  comunidad.replace(/\s+/g, "_") + "_" +
  variante.replace(/\s+/g, "_") + "_" +
  frase.replace(/\s+/g, "_") + ".webm";

enlace.download = nombreArchivo;
          enlace.style.display = "inline";

          document.getElementById("estado").textContent =
            "Grabación terminada. Puedes escuchar y descargar tu audio.";

          flujo.getTracks().forEach(pista => pista.stop());
        };

        grabadora.start();

        document.getElementById("estado").textContent =
          "NAHUATL IA está grabando. Habla ahora.";

      } catch (error) {
        document.getElementById("estado").textContent =
          "Error: " + error.message;
      }
    }

    function detenerGrabacion() {
      if (grabadora && grabadora.state === "recording") {
        grabadora.stop();
      }
    }
  </script>
</body>
</html>
